syntax = "proto3";

package notification.v1;

option go_package = "github.com/ramisoul84/kfc-userapi/gen/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendWelcomeEmail(SendWelcomeEmailRequest) returns (SendWelcomeEmailResponse);
  rpc SendDevicePairingEmail(SendDevicePairingEmailRequest) returns (SendDevicePairingEmailResponse);
  rpc SendLoginCode(SendLoginCodeRequest) returns (SendLoginCodeResponse);
}

// ─────────── Customer sign-in code (SMS) ───────────

message SendLoginCodeRequest {
  string phone         = 1; // E.164, e.g. +79991234567
  string code          = 2;
  int32  valid_seconds = 3;
}

message SendLoginCodeResponse {
  bool success = 1;
}

// ─────────── Welcome Email ───────────

message SendWelcomeEmailRequest {
  string to               = 1;
  string email            = 2;
  string role_name        = 3;
  string initial_password = 4;
  string restaurant_id    = 5;
  string region_id        = 6;
}

message SendWelcomeEmailResponse {
  bool   success         = 1;
  string message         = 2;
  string notification_id = 3;
  google.protobuf.Timestamp sent_at = 4;
}

// ─────────── Device Pairing Email ───────────

message SendDevicePairingEmailRequest {
  string to              = 1;
  string restaurant_id   = 2;
  string restaurant_name = 3;
  int64  expires_at      = 4; // unix seconds
  repeated PairingItem devices = 5;
}

message PairingItem {
  string serial_number = 1;
  string device_type   = 2;
  string code          = 3;
}

message SendDevicePairingEmailResponse {
  bool   success = 1;
  string message = 2;
  google.protobuf.Timestamp sent_at = 3;
}